<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- 3D Isometric Cube Top Face -->
  <polygon points="32,10 52,21 32,32 12,21" fill="url(#cyanGrad)" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- 3D Isometric Cube Left Face -->
  <polygon points="12,21 32,32 32,54 12,43" fill="url(#purpleGrad)" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2" stroke-linejoin="round"/>

  <!-- 3D Isometric Cube Right Face -->
  <polygon points="32,32 52,21 52,43 32,54" fill="url(#cyanGrad)" fill-opacity="0.15" stroke="#06b6d4" stroke-width="2" stroke-linejoin="round"/>

  <!-- Central Core Conduit Axis -->
  <line x1="32" y1="32" x2="32" y2="54" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="12" y2="21" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="52" y2="21" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Glowing Corner Nodes -->
  <circle cx="32" cy="10" r="3.5" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="52" cy="21" r="3.5" fill="#38bdf8"/>
  <circle cx="12" cy="21" r="3.5" fill="#a855f7"/>
  <circle cx="32" cy="32" r="5" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" filter="url(#neonGlow)"/>
  <circle cx="12" cy="43" r="3" fill="#8b5cf6"/>
  <circle cx="52" cy="43" r="3" fill="#06b6d4"/>
  <circle cx="32" cy="54" r="3.5" fill="#38bdf8"/>
</svg>